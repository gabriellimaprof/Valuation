[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "valuation"
version = "0.1.0"
description = "App e biblioteca de valuation de empresas (FCD, multiplos, WACC/CAPM, sensibilidade, diagnostico) com foco no mercado brasileiro"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.0",
    "openpyxl>=3.1",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
app = ["streamlit>=1.40", "plotly>=5.20"]
dev = ["pytest>=7.4", "formulas>=1.2", "streamlit>=1.40", "plotly>=5.20"]

[project.scripts]
valuation = "valuation.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# **`app` nao e empacotado** -- so `src/` entra em `packages.find` --, entao os
# sete arquivos de teste que importam telas dependiam do diretorio do projeto
# estar no `sys.path`. `python -m pytest` o poe ali; `pytest` puro, nao.
#
# Rodando de um jeito na maquina e de outro no CI, a suite ficou verde aqui e
# vermelha la, com `ModuleNotFoundError: No module named 'app'` -- e o erro nao
# era do codigo, era de como se invoca o pytest. Declarar o caminho aqui faz os
# dois jeitos valerem, que e o unico desfecho em que "passou" quer dizer a mesma
# coisa nos dois lugares.
pythonpath = ["."]
