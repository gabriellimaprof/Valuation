[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "valuation"
version = "0.1.0"
description = "App e biblioteca de valuation de empresas (FCD, multiplos, WACC/CAPM, sensibilidade, diagnostico) com foco no mercado brasileiro"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.0",
    "openpyxl>=3.1",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
app = ["streamlit>=1.40", "plotly>=5.20"]
dev = ["pytest>=7.4", "formulas>=1.2", "streamlit>=1.40", "plotly>=5.20"]

[project.scripts]
valuation = "valuation.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
