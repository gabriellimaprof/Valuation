# Duas coisas, e elas custam tempos muito diferentes.
#
# `pytest` roda em ~90 s e vale em toda mudanca. A varredura no navegador sobe o
# app, importa a WEG pela interface e percorre as doze telas: leva minutos e
# baixa um zip da CVM. Ela existe porque tres defeitos ja sairam dali e nenhum
# teste os pegaria -- unidade repetida empurrando o numero para fora da celula,
# rotulo cortado e "R$ milhoes" duas vezes na mesma frase virando LaTeX --, mas
# nao precisa correr a cada commit.
name: testes

on:
  push:
    branches: ["**"]
  pull_request:
  # Segunda de manha. A varredura no navegador nao pode ser condicao de merge --
  # ela baixa dados da CVM, e servico de terceiro fora do ar reprovaria codigo
  # que esta certo --, mas depender de alguem lembrar de disparar e o mesmo que
  # nao ter. O agendamento resolve as duas coisas: roda sozinha, e falhar nao
  # trava ninguem.
  schedule:
    - cron: "0 9 * * 1"
  workflow_dispatch:
    inputs:
      navegador:
        description: "Rodar tambem a varredura no navegador"
        type: boolean
        default: true

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e ".[app,dev]"
      - run: pytest -q

  navegador:
    # So no disparo manual e no agendamento: a varredura baixa dados da CVM, e
    # por isso ela nao pode ser condicao de merge -- servico de terceiro fora do
    # ar reprovaria codigo que esta certo.
    if: >-
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' && inputs.navegador)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e ".[app,dev]" playwright pillow
      - run: python -m playwright install --with-deps chromium
      - name: sobe o app
        run: |
          nohup python -m streamlit run app/main.py \
            --server.port 8501 --server.headless true \
            --browser.gatherUsageStats false > streamlit.log 2>&1 &
          for _ in $(seq 1 60); do
            curl -sf http://localhost:8501 > /dev/null && break
            sleep 2
          done
      - run: python tools/navegador.py 8501
      # A varredura tambem percorre a serie trimestral: ela tem colunas
      # propositalmente vazias, e defeito ali se le como numero errado.
      - run: python tools/navegador.py 8501 --trimestral

      # **O contraste e a unica verificacao que pega esse tipo de regressao.**
      # `pytest` confere que as cores sao as da paleta; contraste e propriedade
      # de **renderizacao**, e so aparece medindo frente contra fundo no
      # navegador. Os dois pares mais apertados do app (placeholder 4,99 e
      # legenda 5,12 no claro) passam por pouco -- sem esta guarda, um passo
      # mais claro no tema os derruba sem nada acusar.
      #
      # Precisa de duas instancias porque `--theme.base` e do servidor: medir os
      # dois modos no mesmo app mediria o mesmo tema duas vezes, que foi
      # exatamente o erro que a primeira versao do script cometeu.
      - name: sobe o app nos dois temas
        run: |
          for tema in dark light; do
            porta=$([ "$tema" = dark ] && echo 8601 || echo 8602)
            nohup python -m streamlit run app/main.py               --server.port "$porta" --server.headless true               --theme.base "$tema"               --browser.gatherUsageStats false > "streamlit-$tema.log" 2>&1 &
            for _ in $(seq 1 60); do
              curl -sf "http://localhost:$porta" > /dev/null && break
              sleep 2
            done
          done
      - run: python tools/contraste.py 8601
      - run: python tools/contraste.py 8602 --claro

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: telas
          path: tools/telas/
          if-no-files-found: ignore
